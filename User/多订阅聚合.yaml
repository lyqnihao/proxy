# 第四部分：代理节点列表
proxies: # 【代理节点列表】开始，这里定义所有具体的单个服务器节点（如果未使用proxy-providers，节点需在此手动定义）
- name: 旁路由_251 # 节点名称，可自定义，在客户端列表和代理组中显示。（如等级、地区、线路、编号）
  type: socks5 # 节点协议类型。选项：ss（Shadowsocks）、vmess（V2Ray）、trojan、http(s)、socks5等
  server: 192.168.10.251 # 服务器的域名或IP地址
  port: 7893 # 服务器的连接端口
  # username: “user123” # 【HTTP代理专用】认证用户名（如果需要）
  # password: “pass123” # 【HTTP代理专用】认证密码（如果需要）
  # 以下是可选的TLS相关字段（仅当 type: https 时可能需要）
  # skip-cert-verify: true
  # sni: proxy.example.com
- name: 旁路由_252 # 节点名称，可自定义，在客户端列表和代理组中显示。（如等级、地区、线路、编号）
  type: socks5 # 节点协议类型。选项：ss（Shadowsocks）、vmess（V2Ray）、trojan、http(s)、socks5等
  server: 192.168.10.252 # 服务器的域名或IP地址
  port: 7893 # 服务器的连接端口
  # username: “user123” # 【HTTP代理专用】认证用户名（如果需要）
  # password: “pass123” # 【HTTP代理专用】认证密码（如果需要）
  # 以下是可选的TLS相关字段（仅当 type: https 时可能需要）
  # skip-cert-verify: true
  # sni: proxy.example.com

# 第五部分：代理组
proxy-groups: # 【代理组】开始，核心功能：将多个节点/子分组组织起来，并设置选择策略
  - name: 🚀 节点选择 # 第一个代理组的名称，会显示在客户端面板上
    type: select # 代理组的类型。select类型：提供一个节点列表供用户手动选择其中一个使用
    proxies: # 该代理组下包含的成员列表，可以是具体节点名，也可以是其他代理组的名称
      - 🔮 负载均衡 # 子代理组（通常type为load-balance）
      - ♻️ 自动选择 # 子代理组（通常type为url-test或fallback）
      - 🔯 故障转移 # 子代理组（通常type为fallback）
      - 🔮 CF自建 # 这是一个具体节点或子组的名称
      - 🇭🇰 香港节点 # 这是一个按地区归类的子代理组
      - 🇨🇳 台湾节点 # 
      - 🇸🇬 狮城节点 # 
      - 🇯🇵 日本节点 # 
      - 🇺🇲 美国节点 # 
      - 🇰🇷 韩国节点 # 
      - 🚀 手动切换 # 可能是一个包含所有具体节点的select组，供用户精确选择
      - DIRECT # 直连，即不经过任何代理。这是Clash内置的特殊策略
  - name: 🚀 手动切换 # 代理组名称，用户可在此组内手动选择一个节点使用
    type: select # 代理组类型：手动选择模式
  #  use: # 【使用】指令，用于从指定的proxy-providers（代理提供者）动态拉取节点作为本组成员
  #    - AA临时_1 # 引用的代理提供者名称（即在proxy-providers:段中定义的“AA临时_1”订阅源）。本组将包含该订阅源下的所有节点。
  #    - ChromeGo_1
  #    - ChromeGo_2
  #    - ChromeGo_3
  #    - ChromeGo_4
  #    - ChromeGo_5
  #    - ChromeGo_6
  #    - 资源分享
  #    - NoMoreWalls
  #    - 每日更新
  #    - ZRF-周润发
  #    - 未知-伊朗TG
    filter: ".*" # 【过滤】规则，使用正则表达式匹配节点名称。`.*`表示匹配所有节点（即不过滤，全部使用）。
  - name: ♻️ 自动选择 # 代理组名称，通常代表会自动选取最优节点的组
    type: url-test # 代理组类型：通过测试URL的延迟和可用性，自动选择延迟最低的节点
    url: http://www.gstatic.com/generate_204 # 用于延迟测试的网址。访问此地址若返回HTTP 204状态码，则视为节点可用并记录耗时
    interval: 3600 # 自动执行延迟测试的间隔时间（秒）。3600秒=60分钟
    tolerance: 500 # 容忍度（毫秒）。当新测出的最优节点比当前使用节点的延迟低超过此值时，才会切换。用于避免频繁切换。
    filter: .*
  - name: 🔯 故障转移 # 代理组名称，通常用于在主节点故障时自动切换到备用节点
    type: fallback # 代理组类型：故障转移模式。按顺序使用组内节点，仅当当前节点不可用时才会切换到下一个
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 500
    filter: .*
  - name: 🔮 负载均衡
    type: load-balance # 代理组类型：负载均衡模式。流量会按策略分发给组内多个节点，共同分担负载
    strategy: consistent-hashing # 负载均衡策略：一致性哈希，散列。将同一目标（如相同IP或域名）的流量始终分配给同一节点，避免频繁切换导致连接中断。
#    strategy: round-robin # 负载均衡另一策略：轮询。按顺序将新连接依次分配给组内每个节点，简单公平，但同一网站可能由不同节点处理。
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 150
    filter: .*
  - name: 🔮 CF自建
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 3600
    tolerance: 300
    filter: .*
