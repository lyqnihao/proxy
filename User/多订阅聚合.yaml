# 第六部分：规则
rules: # 【分流规则】开始。按从上到下的顺序匹配，决定流量走向（走代理、直连或拒绝）
  - RULE-SET,LocalAreaNetwork,DIRECT # 【规则集】语法。表示引用一个名为“LocalAreaNetwork”的预定义规则集，如果匹配（即流量属于局域网），则执行动作“DIRECT”（即直连，不代理）
  - DOMAIN-SUFFIX,lyqnihao.dpdns.org,DIRECT # 自有域名直连规则
  - RULE-SET,UnBan,🎯 全球直连
  - RULE-SET,BanAD,🛑 广告拦截
  - RULE-SET,BanProgramAD,🍃 应用净化
  - RULE-SET,GoogleFCM,📢 谷歌FCM
  - RULE-SET,GoogleCN,🎯 全球直连
  - RULE-SET,SteamCN,🎯 全球直连
  - RULE-SET,Bing,Ⓜ️ 微软Bing
  - RULE-SET,OneDrive,Ⓜ️ 微软云盘
  - RULE-SET,Microsoft,Ⓜ️ 微软服务
  - RULE-SET,Apple,🍎 苹果服务
  - RULE-SET,Telegram,📲 电报消息
  - RULE-SET,AI,💬 Ai平台
  - RULE-SET,OpenAi,💬 Ai平台
  - RULE-SET,NetEaseMusic,🎶 网易音乐
  - RULE-SET,Epic,🎮 游戏平台
  - RULE-SET,Origin,🎮 游戏平台
  - RULE-SET,Sony,🎮 游戏平台
  - RULE-SET,Steam,🎮 游戏平台
  - RULE-SET,Nintendo,🎮 游戏平台
  - RULE-SET,YouTube,📹 油管视频
  - RULE-SET,Netflix,🎥 奈飞视频
  - RULE-SET,Bahamut,📺 巴哈姆特
  - RULE-SET,BilibiliHMT,📺 哔哩哔哩
  - RULE-SET,Bilibili,📺 哔哩哔哩
  - RULE-SET,ChinaMedia,🌏 国内媒体
  - RULE-SET,ProxyMedia,🌍 国外媒体
  - RULE-SET,ProxyGFWlist,🚀 节点选择
  - RULE-SET,ChinaDomain,🎯 全球直连
  - RULE-SET,ChinaCompanyIp,🎯 全球直连
  - RULE-SET,Download,🎯 全球直连
  - GEOIP,CN,🎯 全球直连 # 【GEOIP规则】若流量的目标IP地址属于中国（CN），则交给“🎯 全球直连”组处理（通常为直连）
  - MATCH,🐟 漏网之鱼 # 【MATCH规则】最终兜底规则。所有未被前面任何规则匹配的流量，全部交给“🐟 漏网之鱼”代理组处理

# 第七部分：规则提供者
rule-providers: # 【规则提供者】开始，用于从远程订阅链接动态加载和管理分流规则集
  LocalAreaNetwork: # 规则集的自定义名称，与rules部分中“RULE-SET,LocalAreaNetwork”的引用名对应
    type: http # 类型为http，表示通过HTTP/HTTPS链接获取规则集
    behavior: classical # 规则集的行为模式。classical（经典模式）表示规则文件为纯文本列表（域名、IP等），按行匹配
    url: "https://api.asailor.org/getruleset?type=6&url=aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL0FDTDRTU1IvQUNMNFNTUi9tYXN0ZXIvQ2xhc2gvTG9jYWxBcmVhTmV0d29yay5saXN0" # 远程规则集订阅链接地址（通常是经过封装的ACL4SSR等规则项目链接）
    path: ./providers/7156953299935574564.yaml # 规则集在本地缓存的相对路径和文件名（通常由哈希值命名，避免冲突）
    interval: 86400 # 自动更新规则集的间隔时间（秒）。86400秒 = 24小时
