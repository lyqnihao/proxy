# 第一部分：基础端口和模式设置
port: 7890 # HTTP代理端口，供系统、浏览器等软件使用
socks-port: 7891 # SOCKS5代理端口，供支持此协议的专用软件（如Telegram）使用
allow-lan: true # 允许局域网连接，开启后同一网络下的其他设备可使用本机代理
mode: rule # 规则模式，流量将根据下方rules规则列表进行智能分流（推荐）
log-level: info # 日志级别，info记录常规运行信息，调试时可改为debug

# 第二部分：外部控制
external-controller: 127.0.0.1:9090 # 外部控制接口，用于连接网页面板（如访问 http://127.0.0.1:9090/ui）

