name: 每日更新 warp 配置
    # 从https://m2c.pages.dev/ 自动一键生成yaml文件并替换至 https://github.com/lyqnihao/proxy/User 目录下
on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC。每 12 小时一次（UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00）
    - cron: '0 */12 * * *'
  workflow_dispatch:   # 支持在 Actions 页面手动触发测试

permissions:
  contents: write      # 允许推送到本仓库（需在仓库设置中开启读写权限）

concurrency:
  group: update-clash
  cancel-in-progress: false

jobs:
  update-clash:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Playwright 与 Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 打开网站、点击按钮并下载 YAML
        run: |
          cat > /tmp/gen_clash.py <<'PYEOF'
          import asyncio, os, re
          from datetime import datetime, timezone, timedelta
          from playwright.async_api import async_playwright

          TARGET_DIR = "User"                       # 目标目录
          EXPECT_NAME = "MASQUE-To-Clash-H3.yaml"   # 目标文件名（与网站下载名一致）
          TMP = "/tmp/masque_download.yaml"         # 临时下载路径
          README = "README.md"                      # 需同步更新日期的 README
          if not os.path.isfile(README) and os.path.isfile("readme.md"):
              README = "readme.md"
          MARKER = "/tmp/commit_msg"                # 有真实更新时写入提交标题
          OBJECT = "warp"                           # 提交标题中的对象名
          SOURCE = "https://m2c.pages.dev/"         # 提交标题中的来源网址
          CN_TZ = timezone(timedelta(hours=8))      # 北京时间（不依赖系统 tzdata）
          MAX_RETRY = 3

          async def try_once(p):
              browser = await p.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu"],
              )
              try:
                  ctx = await browser.new_context(accept_downloads=True)
                  page = await ctx.new_page()
                  # 拦截 alert 弹窗，避免失败时阻塞流程
                  page.on("dialog", lambda d: asyncio.ensure_future(d.dismiss()))
                  await page.goto("https://m2c.pages.dev/", wait_until="domcontentloaded", timeout=60000)
                  await page.wait_for_selector("#genBtn", timeout=30000)
                  async with page.expect_download(timeout=90000) as info:
                      await page.click("#genBtn")   # 点击「一键生成 Clash 配置文件」
                  dl = await info.value
                  name = dl.suggested_filename
                  await dl.save_as(TMP)
                  return name
              finally:
                  await browser.close()

          async def fetch():
              async with async_playwright() as p:
                  for attempt in range(1, MAX_RETRY + 1):
                      try:
                          return await try_once(p)
                      except Exception as e:
                          print(f"第 {attempt}/{MAX_RETRY} 次尝试失败: {e}")
                          if attempt == MAX_RETRY:
                              raise
                          await asyncio.sleep(10)

          def update_readme():
              """有真实更新时，按内容特征定位 README 中的 MASQUE 订阅行，更新其首列日期（北京时间）"""
              if not os.path.isfile(README):
                  print(f"{README} 不存在，跳过日期更新")
                  return
              with open(README, "r", encoding="utf-8", newline="") as f:
                  lines = f.readlines()

              # 逻辑查找：同时含来源网址与目标文件名的表格行，唯一对应 MASQUE 订阅行，不受行号漂移影响
              idx = next(
                  (i for i, ln in enumerate(lines)
                   if ln.lstrip().startswith("|") and SOURCE in ln and EXPECT_NAME in ln),
                  None,
              )
              if idx is None:
                  print("未定位到 MASQUE 订阅行，跳过日期更新")
                  return
              new_line, n = re.subn(
                  r"(\|\s*)\d{4}-\d{2}-\d{2}(\s*\|)",
                  lambda m: m.group(1) + datetime.now(CN_TZ).strftime("%Y-%m-%d") + m.group(2),
                  lines[idx], count=1,
              )
              if n == 0:
                  print(f"第 {idx + 1} 行首列未匹配到日期格式，跳过日期更新")
                  return
              if new_line == lines[idx]:
                  print(f"README 第 {idx + 1} 行日期已是当前日期，无需改动")
                  return
              lines[idx] = new_line
              with open(README, "w", encoding="utf-8", newline="") as f:
                  f.writelines(lines)
              print(f"已更新 {README} 第 {idx + 1} 行日期为 {datetime.now(CN_TZ).strftime('%Y-%m-%d')}")

          def main():
              name = asyncio.run(fetch())
              print(f"下载文件名: {name}")

              # 文件名校验：不一致则跳过，避免误新增其它文件
              if name != EXPECT_NAME:
                  print(f"文件名与预期不符（预期 {EXPECT_NAME}），跳过替换，保留原文件")
                  return

              # 大小校验
              if not os.path.isfile(TMP) or os.path.getsize(TMP) < 1000:
                  print("文件为空或过小，保留原文件")
                  return

              # 内容校验：必须包含 Clash 配置关键字段
              with open(TMP, "r", encoding="utf-8", errors="replace") as f:
                  text = f.read()
              if not all(k in text for k in ("proxies:", "proxy-groups:", "mode:")):
                  print("内容校验失败（缺少关键字段），保留原文件")
                  return

              # 覆盖 User 目录下的同名文件（内容无变化则不替换）
              os.makedirs(TARGET_DIR, exist_ok=True)
              dest = os.path.join(TARGET_DIR, EXPECT_NAME)

              # ===== 新增判断：与现有文件逐字对比，完全一致则跳过替换，保留原文件 =====
              if os.path.isfile(dest):
                  with open(dest, "r", encoding="utf-8", errors="replace") as f:
                      old_text = f.read()
                  if old_text == text:
                      print("内容与现有文件完全一致，跳过替换，保留原文件")
                      return

              with open(dest, "w", encoding="utf-8", newline="\n") as f:
                  f.write(text)
              print(f"已更新: {dest} ({len(text)} 字符)")

              # ===== 有真实更新：同步 README 日期 + 写提交标记与标题 =====
              update_readme()
              with open(MARKER, "w", encoding="utf-8") as f:
                  f.write("1")                       # 标记本轮发生了真实更新
              stamp = datetime.now(CN_TZ).strftime("%Y-%m-%d %H:%M:%S")
              title = f"{OBJECT}_{stamp} - Update from {SOURCE}"
              with open("/tmp/commit_title", "w", encoding="utf-8") as f:
                  f.write(title)
              print(f"提交标题: {title}")

          main()
          PYEOF
          python /tmp/gen_clash.py

      - name: 有真实更新才提交并推送
        run: |
          # 仅当脚本标记了真实更新时才提交，无变化则保留原文件、README 与历史不动
          if [ ! -f /tmp/commit_msg ]; then
            echo "本轮无真实内容更新，跳过提交"
            exit 0
          fi
          TITLE=$(cat /tmp/commit_title)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "User/MASQUE-To-Clash-H3.yaml" "README.md"
          if git diff --cached --quiet; then
            echo "暂存区无变化，跳过提交"
          else
            git commit -m "$TITLE"
            git push
            echo "已推送更新：$TITLE"
          fi
